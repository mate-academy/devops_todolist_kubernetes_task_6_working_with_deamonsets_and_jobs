apiVersion: batch/v1
kind: CronJob
metadata:
  name: todoapp-cronjob
  namespace: mateapp
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  startingDeadlineSeconds: 100
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            job: todoapp-healthcheck
        spec:
          containers:
          - name: busybox
            image: ikulyk404/busyboxplus:curl
            resources:
              requests:
                cpu: "100m"
                memory: "100Mi"
              limits:
                cpu: "200m"
                memory: "200Mi"
            command: ["/bin/sh", "-c"]
            args:
              - |
                echo "[$(date)] CronJob calling /api/health...";
                curl -sS http://todoapp-service/api/health
          restartPolicy: OnFailure
