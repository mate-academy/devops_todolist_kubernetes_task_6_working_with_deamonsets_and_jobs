apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob
  namespace: mateapp
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: health-check
              image: busyboxplus:curl
              resources:
                requests:
                  memory: "40Mi"
                  cpu: "20m"
                limits:
                  memory: "90Mi"
                  cpu: "40m"
              command:
                - /bin/sh
                - -c
                - curl http://todoapp-service.todoapp.svc.cluster.local/api/health

          restartPolicy: OnFailure