apiVersion: batch/v1
kind: CronJob
metadata:
  name: hello-cronjob
  namespace: mateapp
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: mate-server
            image: busyboxplus:curl
            command: ["sh", "-c", "curl http://todoapp-service:80/api/health"]
            resources:
              requests:
                cpu: "100m"
                memory: "100Mi"
              limits:
                cpu: "200m"
                memory: "200Mi"
            restartPolicy: OnFailure
