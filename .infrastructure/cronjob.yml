apiVersion: batch/v1
kind: CronJob
metadata:
  name: healh-check
  namespace: mateapp
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit : 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: health
            image: ikulyk404/busyboxplus:curl
            command:
            - /bin/sh
            - -c
            - curl http://todoapp.service.todoapp.svc.cluster.local/api/health
            resources:
              requests:
                cpu: "20m"
                memory: "50Mi"
              limits: 
                cpu: "100m"
                memory: "128Mi"
          restartPolicy: OnFailure
