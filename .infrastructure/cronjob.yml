apiVersion: batch/v1
kind: CronJob
metadata:
  name: health-checker
  namespace: mateapp
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: health-curl
            image: ikulyk404/busyboxplus:curl
            command: ["curl", "-s", "http://todoapp-internal.mateapp.svc.cluster.local/api/health"]
            resources:
              requests:
                cpu: "50m"
                memory: "64Mi"
              limits:
                cpu: "100m"
                memory: "128Mi"
          restartPolicy: OnFailure