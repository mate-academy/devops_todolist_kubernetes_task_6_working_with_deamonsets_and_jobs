apiVersion: batch/v1
kind: CronJob
metadata:
  name: api-health-crojob
  namespace: mateapp
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  startingDeadlineSeconds: 100
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: api-health
            image: ikulyk404/busyboxplus:curl
            command:
            - sh
            - -c
            - curl http://todoapp-clusterip.mateapp.svc.cluster.local/api/health
          restartPolicy: OnFailure