apiVersion: batch/v1
kind: CronJob
metadata:
  name: curl-job
  namespace: mateapp
spec:
  schedule: '*/4 * * * *'
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: hello
              image: ikulyk404/busyboxplus:curl
              resources:
                requests:
                  cpu: '64m'
                  memory: '100Mi'
                limits:
                  cpu: '128m'
                  memory: '150Mi'
              command:
                - /bin/sh
                - -c
                - curl http://todoapp-service.todoapp.svc.cluster.local/api/health
          restartPolicy: OnFailure