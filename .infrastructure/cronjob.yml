apiVersion: batch/v1
kind: CronJob
metadata:
  name: todoapp-health-job
  namespace: mateapp
spec:
  schedule: "*/4 * * * *"

  concurrencyPolicy: Allow

  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: curl-runner
            image: ikulyk404/busyboxplus:curl
            command: ["sh", "-c", "date; curl -sS -i http://todoapp-service/api/health"]

            resources:
              requests:
                memory: "32Mi"
                cpu: "50m"
              limits:
                memory: "64Mi"
                cpu: "100m"
          restartPolicy: OnFailure
