apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob
  namespace: mateapp
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: busyboxplus
              image: busyboxplus:curl
              command: ["curl", "todoapp-service:8000/api/health"]
              resources:
                requests:
                  memory: "100Mi"
                  cpu: "100m"
                limits:
                  memory: "200Mi"
                  cpu: "200m"
          restartPolicy: OnFailure
