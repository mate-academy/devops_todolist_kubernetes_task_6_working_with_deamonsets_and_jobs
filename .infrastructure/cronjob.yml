apiVersion: batch/v1
kind: CronJob
metadata:
  name: busyboxplus-cronjob
  namespace: mateapp
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  startingDeadlineSeconds: 100
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: busyboxplus
            image: ikulyk404/busyboxplus:curl
            command: ["/bin/sh", "-c"]
            args: 
            - curl http://todoapp-service/api/health
            resources:
              requests:
                cpu: "10m"
                memory: "10Mi"
              limits:
                cpu: "100m"
                memory: "32Mi"
          restartPolicy: OnFailure
          

