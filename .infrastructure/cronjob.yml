apiVersion: batch/v1
kind: CronJob
metadata:
  name: todoapp
  namespace: mateapp
spec:
  schedule: "*/4 * * *"
  concurrencyPolicy: Allow
  successfulJobHistoryLimit: 10
  failedJobHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: busyboxplus
              image: busyboxplus:curl
              command:
                - curl
                - -f
                - http://todoapp/api/health
              resources:
                requests:
                  cpu: "10m"
                  memory: "16Mi"
                limits:
                  cpu: "50m"
                  memory: "32Mi"
