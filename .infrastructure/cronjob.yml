apiVersion: batch/v1
kind: CronJob
metadata:
  name: cron-health-check
  namespace: mateapp
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: healthcheck
            image: trickykot3/busyboxplus:curl
            resources:
              requests:
                memory: "100Mi"
                cpu: "100m"
              limits:
                memory: "200Mi"
                cpu: "200m"
            command:
            - /bin/sh
            - -c
            - curl http://todoapp-service.todoapp.svc.cluster.local/api/health
          restartPolicy: OnFailure