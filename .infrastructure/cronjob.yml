apiVersion: batch/v1
kind: CronJob
metadata:
  name: todoapp-cron
  namespace: mateapp
spec:
  schedule: "*/4 * * * *" # кожні 4 хвилини
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl-on-schedule
              image: radial/busyboxplus:curl
              # Раз на 4 хвилини викликає /api/health сервісу ToDo
              args: ["curl", "-s", "http://todoapp-clusterip.mateapp.svc.cluster.local:8000/api/health"]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
 