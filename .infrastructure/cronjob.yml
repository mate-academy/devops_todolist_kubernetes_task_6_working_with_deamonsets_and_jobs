apiVersion: batch/v1
kind: CronJob
metadata:
  name: todoapp-health
  namespace: mateapp
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: curl
              image: ikulyk404/busyboxplus:curl
              resources:
                requests:
                  cpu: "10m"
                  memory: "32Mi"
                limits:
                  cpu: "50m"
                  memory: "64Mi"
              command:
                - sh
                - -c
                - |
                  date;
                  curl -sS -i http://todoapp-service/api/health

