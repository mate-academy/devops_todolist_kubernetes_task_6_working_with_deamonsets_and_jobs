apiVersion: batch/v1
kind: CronJob
metadata:
 name: todoapp-cronjob
 namespace: mateapp
spec:
 schedule: "*/4 * * * *"
 concurrencyPolicy: Allow
 startingDeadlineSeconds: 30
 successfulJobsHistoryLimit: 10
 failedJobsHistoryLimit: 5
 jobTemplate:
   spec:
     template:
       spec:
         containers:
         - name: health-check
           image: busyboxplus:curl
           resources:
            requests:
              memory: "100Mi"
              cpu: "100m"
            limits:
              memory: "100Mi"
              cpu: "100m"
           command:
           - /bin/sh
           - -c
           - curl -s http://todoapp-service.mateapp.svc.cluster.local:8080/api/health
         restartPolicy: OnFailure