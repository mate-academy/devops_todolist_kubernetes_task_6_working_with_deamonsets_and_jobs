apiVersion: batch/v1
kind: CronJob
metadata:
  name: hello-cronjob
  namespace: mateapp
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: busybox
            image: busyboxplus:curl
            command:
              - /bin/sh
              - -c
              - curl -s http://todoapp-service.todoapp/api/health
            resources: # Добавлено по условию
              requests:
                cpu: "50m"
                memory: "64Mi"
              limits:
                cpu: "100m"
                memory: "128Mi"
          restartPolicy: OnFailure