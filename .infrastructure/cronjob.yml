apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob
  namespace: mateapp
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  startingDeadlineSeconds: 30
  successfulJobHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: health-check
              image: radial/busyboxplus:curl
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "250m"
                  memory: "256Mi"
              command: ["/bin/sh", "-c"]
              args:
                - >
                  echo "Checking todoapp /api/health endpoint...";
                  curl -s http://todoapp-service/api/health || echo "Failed to reach todoapp"
              restartPolicy: OnFailure