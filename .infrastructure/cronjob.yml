apiVersion: batch/v1
kind: CronJob
metadata:
  name: todoapp-cronjob
  namespace: mateapp
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
            restartPolicy: OnFailure
            containers:
                - name: todoapp-job
                  image: busyboxplus:curl
                  command:
                    - /bin/sh
                    - -c
                    - curl -s http://todoapp-service.mateapp:80/api/health
                  resources:
                    requests:
                      cpu: "100m"
                      memory: "100Mi"
                    limits:
                      cpu: "200m"
                      memory: "200Mi"