apiVersion: batch/v1
kind: CronJob
metadata:
  name: hello-cronjob
  namespace: mateapp
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  startingDeadlineSeconds: 100
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: hello
              image: busyboxplus:curl
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "200m"
                  memory: "256Mi"
              command:
                - /bin/sh
                - -c
                - curl -s http://todoapp/api/health
          restartPolicy: OnFailure
