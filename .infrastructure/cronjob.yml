apiVersion: batch/v1
kind: CronJob
metadata:
  name: health-check
  namespace: mateapp
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: "Allow"
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: curl
            image: busyboxplus:curl
            resources:
              requests:
                memory: "32Mi"
                cpu: "100m"
              limits:
                memory: "64Mi"
                cpu: "200m"
            command: ["/bin/sh", "-c"]
            args:
              - curl http://todoapp-service.todoapp.svc.cluster.local/api/health
          restartPolicy: OnFailure

