apiVersion: batch/v1
kind: CronJob
metadata:
 name: todoapp-cronjob
 namespace: mateapp
spec:
 schedule: "*/4 * * * *"
 concurrencyPolicy: Allow
 startingDeadlineSeconds: 100
 successfulJobsHistoryLimit: 10
 failedJobsHistoryLimit: 5
 jobTemplate:
   spec:
     template:
       spec:
         containers:
         - name: todoapp-cron
           resources:
             requests:
               cpu: "100m"
               memory: "100Mi"
             limits:
               cpu: "200m"
               memory: "200Mi"
           image: busyboxplus:curl
           command:
           - curl
           - 0.0.0.0:8080
           - /api/health
         restartPolicy: Never