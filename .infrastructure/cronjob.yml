apiVersion: batch/v1
kind: CronJob
metadata:
  name: todoapp-health-check
  namespace: mateapp
  labels:
    app: todoapp-health-check
    component: cronjob
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    metadata:
      labels:
        app: todoapp-health-check
        component: cronjob-job
    spec:
      template:
        metadata:
          labels:
            app: todoapp-health-check
            component: cronjob-pod
        spec:
          containers:
            - name: health-checker
              image: busyboxplus:curl
              command:
                - /bin/sh
                - -c
                - curl -v http://todoapp-service.todoapp.svc.cluster.local/api/health
              resources:
                requests:
                  memory: "50Mi"
                  cpu: "50m"
                limits:
                  memory: "100Mi"
                  cpu: "100m"
          restartPolicy: OnFailure
