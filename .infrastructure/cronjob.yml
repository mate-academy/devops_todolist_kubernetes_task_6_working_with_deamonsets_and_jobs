apiVersion: batch/v1
kind: CronJob
metadata:
  name: health-cronjob
  namespace: mateapp
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  startingDeadlineSeconds: 100
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: check-health
              image: curlimages/curl:latest # busyboxplus:curl - not working
              command:
                - /bin/sh
                - -c
                - curl http://todoapp-service/api/health
          restartPolicy: OnFailure