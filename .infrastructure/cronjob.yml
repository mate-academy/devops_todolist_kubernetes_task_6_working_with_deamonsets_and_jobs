apiVersion: batch/v1
kind: CronJob
metadata:
  name: todoapp-healthcheck
  namespace: mateapp
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: curl
            image: ikulyk404/busyboxplus:curl
            resources:
              requests:
                cpu: "10m"
                memory: "32Mi"
              limits:
                cpu: "50m"
                memory: "64Mi"
            command:
              - /bin/sh
              - -c
              - date; curl -s http://todoapp-service.mateapp.svc.cluster.local/api/health
          restartPolicy: Never