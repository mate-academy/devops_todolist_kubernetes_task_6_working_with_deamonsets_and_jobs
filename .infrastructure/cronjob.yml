apiVersion: batch/v1
kind: CronJob
metadata:
  name: todo-health-check
  namespace: mateapp
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: curl-container
            image: busyboxplus:curl
            resources:
              requests:
                cpu: "50m"
                memory: "64Mi"
              limits:
                cpu: "100m"
                memory: "128Mi"
            command:
              - /bin/sh
              - -c
              - curl -s http://todoapp-svc.mateapp.svc.cluster.local/api/health
          restartPolicy: OnFailure