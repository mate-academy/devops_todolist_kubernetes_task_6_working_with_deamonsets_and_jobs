apiVersion: batch/v1
kind: CronJob
metadata:
  name: todoapp
  namespace: mateapp
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: "Allow"
  successfulJobHistoryLimit: 10
  failedJobHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: container
            image: busyboxplus:curl
            resources:
              requests:
                cpu: "100m"
                memory: "100Mi"
              limits:
                cpu: "200m"
                memory: "200Mi"
            command:
            - /bin/sh
            - -c
            - curl http://todoapp-service/api/health