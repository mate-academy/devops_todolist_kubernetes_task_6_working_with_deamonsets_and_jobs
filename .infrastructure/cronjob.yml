apiVersion: batch/v1
kind: CronJob
metadata:
  name: busybox-cron-job
  namespace: todoapp
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  startingDeadlineSeconds: 100
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: hello
              image: ikulyk404/busyboxplus:curl
              resources:
                requests:
                  cpu: "100m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
              command: ["/bin/sh", "-c", "curl http://todoapp-service.todoapp.svc.cluster.local:80/api/health"]
          restartPolicy: OnFailure
