apiVersion: batch/v1
kind: CronJob
metadata:
  name: mateapp-cronjob
  namespace: mateapp
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: busybox-curl
            image: busyboxplus:curl
            command: ["/bin/sh", "-c", "curl http://todoapp-clusterip/api/health"]
            resources:
              requests:
                memory: "64Mi"
                cpu: "100m"
              limits:
                memory: "128Mi"
                cpu: "200m"
          restartPolicy: OnFailure