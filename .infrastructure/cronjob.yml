apiVersion: batch/v1
kind: CronJob
metadata:
  name: busybox-cron
  namespace: mateapp
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: cronjob
              image: ikulyk404/busyboxplus:curl
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "150m"
                limits:
                  memory: "256Mi"
                  cpu: "150m"
              command: ["/bin/sh", "-c", "date && curl http://todoapp-service.todoapp.svc.cluster.local:80/api/health" ]
          restartPolicy: OnFailure
    
