apiVersion: batch/v1
kind: CronJob
metadata:
  name: todoapp-cronjob-healthcheck
  namespace: mateapp
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: busyboxplus:curl
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - curl -sS http://todoapp-service/api/health
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "100m"
                  memory: "128Mi"
