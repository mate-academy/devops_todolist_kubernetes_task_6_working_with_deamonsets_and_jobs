
apiVersion: batch/v1
kind: CronJob
metadata:
  name: todoapp-health-cron
  namespace: mateapp
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: curl
              image: radial/busyboxplus:curl
              command:
                - /bin/sh
                - -c
                - "curl -f http://todoapp.mateapp.svc.cluster.local:80/api/health"
              resources:
                requests:
                  cpu: "50m"
                  memory: "32Mi"
                limits:
                  cpu: "100m"
                  memory: "64Mi"
