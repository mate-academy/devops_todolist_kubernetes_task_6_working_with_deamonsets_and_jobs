apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: todoapp-bbx
  namespace: mateapp
  labels:
    app: todoapp
spec:
  selector:
    matchLabels:
      app: todoapp-server
  template:
    metadata:
      labels:
        app: todoapp-server
    spec:
      containers:
        - name: busybox
          image: busyboxplus:curl
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                curl -s http://todoapp-service.mateapp.svc.cluster.local/;
                sleep 5;
              done
          resources:
            requests:
              cpu: "100m"
              memory: "100Mi"
            limits:
              cpu: "200m"
              memory: "200Mi"
          ports:
            - containerPort: 80
              hostPort: 30008
