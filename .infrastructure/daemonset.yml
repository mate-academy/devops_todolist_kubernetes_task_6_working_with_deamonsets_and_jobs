apiVersion: apps/v1
kind: DaemonSet
metadata: 
  name: todoapp
  namespace: mateapp
  labels: 
    app: todoapp
spec:
  selector: 
    matchLabels:
      app: todoapp
  template: 
    metadata: 
      labels:
        app: todoapp
    spec:
      containers:
      - name: todoapp
        image: busybox:curl
        resources:
          requests:
            cpu: "100m"
            memory: "100Mi"
          limits:
            cpu: "200m"
            memory: "250Mi"
        ports:
        - containerPort: 80
          hostPort: 30008
        command:
            - /bin/sh
            - -c
            - |
              while true; do
                echo "Pinging ToDo app service...";
                curl -s http://todoapp-service.mateapp.svc.cluster.local || echo "Service not reachable";
                sleep 5;
              done