apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: todoapp-monitoring
  namespace: mateapp
  labels:
    app: todoapp-monitoring
spec:
  selector:
    matchLabels:
      app: todoapp-monitoring
  template:
    metadata:
      labels:
        app: todoapp-monitoring
    spec:
      containers:
      - name: todo-curl-container
        image: busyboxplus:curl
        command: ["sh", "-c", "while true; do curl -sf todoapp:80/api/health; sleep 5; done"]
        resources:
          requests:
            cpu: "100m"
            memory: "100Mi"
          limits:
            cpu: "200m"
            memory: "200Mi"
