apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: todo-server
  namespace: mateapp
  labels:
    app: todo-server
spec:
  selector:
    matchLabels:
      app: todo-server
  template:
    metadata:
      labels:
        app: todo-server
    spec:
      containers:
        - name: todo-server
          image: ikulyk404/busyboxplus:curl
          command:
            - /bin/sh
            - -c
            - while true; do
              curl http://todoapp-service.todoapp.svc.cluster.local;
              sleep 5;
              done
          resources:
            requests:
              cpu: '100m'
              memory: '100Mi'
            limits:
              cpu: '200m'
              memory: '200Mi'
          ports:
            - containerPort: 80
              hostPort: 30008