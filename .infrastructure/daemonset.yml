apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: todoapp-daemon
  namespace: mateapp
spec:
  selector:
    matchLabels:
      app: todoapp-daemon
  template:
    metadata:
      labels:
        app: todoapp-daemon
    spec:
      containers:
        - name: curl-agent
          image: radial/busyboxplus:curl
          # Кожні 5 секунд шле HTTP-запит на ClusterIP сервіс ToDo
          args:
            - /bin/sh
            - -c
            - >
              while true; do
                curl -s http://todoapp-clusterip.mateapp.svc.cluster.local:8000/api/health || echo "curl failed";
                sleep 5;
              done
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
