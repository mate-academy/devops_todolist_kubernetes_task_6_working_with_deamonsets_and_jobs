apiVersion: apps/v1
kind: DaemonSet
metadata: 
  name: todoapp-server
  namespace: mateapp
  labels:
    app: todoapp-server
spec:
  selector:
    matchLabels:
      app: todoapp-server
  template:
    metadata:
      labels:
        app: todoapp-server
    spec:
      containers:
      - name: todoapp-server
        image: ikulyk404/busyboxplus:curl
        command:
          - /bin/sh
          - -c
          - while true; 
            do curl http://todoapp.service.todoapp.svc.cluster.local;
            sleep 5;
            done
        resources:
          requests:
            memory: "100Mi"
            cpu: "100m"
          limits: 
            memory: "200Mi"
            cpu: "200m"
        ports:
          - containerPort: 80
            hostPort: 30080
