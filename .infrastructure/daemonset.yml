apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: todoapp-curl
  namespace: mateapp
  labels:
    app: todoapp-curl
spec:
  selector:
    matchLabels:
      app: todoapp-curl
  template:
    metadata:
      labels:
        app: todoapp-curl
    spec:
      containers:
      - name: busybox
        image: busyboxplus:curl
        command:
        - /bin/sh
        - -c
        - |
          while true; do
            echo "$(date) $(curl -s http://todoapp-service.mateapp.svc.cluster.local/api/health)"
            sleep 5
          done
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
