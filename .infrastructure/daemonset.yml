apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: todolist
  namespace: mateapp
  labels:
    app: todolist
spec:
  selector:
    matchLabels:
      app: todolist
  template:
    metadata:
      labels:
         app: todolist
    spec:
      containers:
        - name: todolist
          image: busyboxplus:curl
          resources:
            requests:
              cpu: "100m"
              memory: "100Mi"
            limits:
              cpu: "200m"
              memory: "200Mi"
          command:
            - /bin/sh
            - -c
            - |
              while true; do
              curl http://todoapp:80
              sleep 5
              done
