apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mate-server
  namespace: mateapp
  labels: 
    app: todoapp
spec:
  selector:
    matchLabels: 
      app: todoapp
  template:
    metadata: 
      labels:
        app: todoapp
    spec:
      containers:
      - name: busybox
        image: busyboxplus:curl
        command: ["/bin/sh", "-c"]
        args: 
        - | 
          while true; do
            curl http://todoapp.mateapp.svc.cluster.local
            sleep 5
          done
        resources:
          requests:
            cpu: "100m"
            memory: "100Mi"
          limits:
            cpu: "200m"
            memory: "200Mi"
        ports:
        - containerPort: 80
          hostPort: 30000
