apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: todo-daemonset
  namespace: mateapp
spec:
  selector:
    matchLabels:
      app: todo-daemonset
  template:
    metadata:
      labels:
        app: todo-daemonset
    spec:
      containers:
      - name: busybox
        image: trickykot3/busyboxplus:curl
        resources:
          requests:
            memory: "100Mi"
            cpu: "100m"
          limits:
            memory: "200Mi"
            cpu: "200m"
        command:
        - /bin/sh
        - -c
        - while true; do curl http://todoapp-service.todoapp.svc.cluster.local; sleep 5; done