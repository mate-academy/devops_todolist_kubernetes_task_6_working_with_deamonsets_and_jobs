apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mateapp-daemonset
  namespace: mateapp
  labels:
    app: mateapp
spec:
  selector:
    matchLabels:
      app: mateapp
  template:
    metadata:
      labels:
        app: mateapp
    spec:
      containers:
        - name: curl
          image: curlimages/curl
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                curl -s -o /dev/null -w "%{http_code}\n" http://mateapp-service.mateapp.svc.cluster.local:80
                sleep 5
              done
          resources:
            requests:
              memory: "100Mi"
              cpu: "100m"
            limits:
              memory: "200Mi"
              cpu: "200m"
