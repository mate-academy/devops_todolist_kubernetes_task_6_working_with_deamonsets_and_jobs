apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: todoapp-server
  namespace: mateapp
  labels:
    app: todoapp-server
spec:
  selector:
    matchLabels:
      app: todoapp-server
  template:
    metadata:
      labels:
        app: todoapp-server
    spec:
      containers:
      - name: todoapp-server
        image: ikulyk404/busyboxplus:curl
        resources:
          requests:
            cpu: "100m"
            memory: "100Mi"
          limits:
            cpu: "200m"
            memory: "200Mi"
        command: ["sh", "-c", "while true; do curl http://todoapp.mateapp.svc.cluster.local; sleep 5; done"]
        ports:
        - containerPort: 80
          hostPort: 30080