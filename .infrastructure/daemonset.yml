apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: todoapp-daemonset
  namespace: mateapp
spec:
  selector:
    matchLabels:
      app: todoapp-daemonset
  template:
    metadata:
      labels:
        app: todoapp-daemonset
    spec:
      containers:
        - name: busyboxplus
          image: ikulyk404/busyboxplus:curl
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                echo "$(date) - Checking TodoApp..."
                curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" \
                  http://todoapp-service.todoapp.svc.cluster.local:80/api/health
                sleep 5
              done
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"