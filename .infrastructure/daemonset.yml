apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: todoapp
  namespace: mateapp
  labels:
    app: todoapp
spec:
  selector:
    matchLabels:
      app: todoapp-curl-service
  template:
    metadata:
      labels:
        app: todoapp-curl-service
    spec:
      containers:
        - name: todoapp-curl-service
          image: busyboxplus:curl
          command: [ "/bin/sh", "-c" ]
          args:
            - |
              while true;
              do
                echo "Sending curl request..."
                curl -v http://todoapp-service.todoapp.svc.cluster.local
                sleep 5;
              done
          resources:
            requests:
              memory: "50Mi"
              cpu: "50m"
            limits:
              memory: "100Mi"
              cpu: "100m"
          ports:
            - containerPort: 80
              hostPort: 30008
