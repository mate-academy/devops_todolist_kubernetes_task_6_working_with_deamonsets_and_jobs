apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: curl-daemonset
  namespace: mateapp
spec:
  selector:
    matchLabels:
      app: curl-daemonset
  template:
    metadata:
      labels:
        app: curl-daemonset
    spec:
      containers:
        - name: curl
          image: ikulyk404/busyboxplus:curl
          command: ["sh", "-c", "while true; do curl -s http://todoapp-service.todoapp/api/health; echo; sleep 5; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
              