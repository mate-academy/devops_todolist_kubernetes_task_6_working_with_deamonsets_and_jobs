apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: todoapp-curl
  namespace: mateapp
  labels:
    app: todoapp-curl
spec:
  selector:
    matchLabels:
      app: todoapp-curl
  template:
    metadata:
      labels:
        app: todoapp-curl
    spec:
      containers:
        - name: todoapp-curl
          image: ikulyk404/busyboxplus:curl
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "50m"
              memory: "64Mi"
          command:
            - /bin/sh
            - -c
            - while true; do date; curl -s http://todoapp-service.mateapp.svc.cluster.local; sleep 5; done