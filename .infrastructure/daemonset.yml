apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: todoapp-curl
  namespace: mateapp
spec:
  selector:
    matchLabels:
      app: todoapp-curl
  template:
    metadata:
      labels:
        app: todoapp-curl
    spec:
      containers:
        - name: todoapp-curl
          image: busyboxplus:curl
          resources:
            requests:
              cpu: "0.1"
              memory: "100Mi"
            limits:
              cpu: "0.2"
              memory: "200Mi"
          command: ["sh", "-c"]
          args: 
            - |
              while true; do
                curl http://todoapp-service
                sleep 5
              done