apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: daemonset
  namespace: mateapp
  labels:
    app: daemonset
spec:
  selector:
    matchLabels:
      app: daemonset
  template:
    metadata:
      labels:
        app: daemonset
    spec:
      containers:
        - name: busybox
          image: busyboxplus:curl
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          ports:
            - containerPort: 80
          command: [ "/bin/sh", "-c" ]
          args:
              - >
                while true;
                do
                  echo "$(date): Checking todoapp...";
                  curl -fsS http://todoapp:80;
                  sleep 5;
                done