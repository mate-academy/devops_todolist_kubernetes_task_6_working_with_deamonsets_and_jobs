apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: todoapp-daemonset
  namespace: mateapp
spec:
  selector:
    matchLabels:
      app: todoapp-daemonset
  template:
    metadata:
      labels:
        app: todoapp-daemonset
    spec:
      containers:
        - name: busybox
          image: busyboxplus:curl
          command:
            - /bin/sh
            - -c
            - while true; do curl -s http://todoapp-clusterip.mateapp.svc.cluster.local; sleep 5; done
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi