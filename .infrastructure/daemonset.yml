apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: todoapp-server
  namespace: mateapp
  labels:
    app: todoapp-server
spec:
  selector:
    matchLabels:
      app: todoapp-server
  template:
    metadata:
      labels:
        app: todoapp-server
    spec:
      containers:
      - name: todoapp-server
        image: busyboxplus:curl
        command: ["/bin/sh", "-c"]
        args:
        - |
          while true; do
            curl -s http://todoapp-service;
            sleep 5;
          done
        resources:
          requests:
            cpu: "100m"
            memory: "100Mi"
          limits:
            cpu: "200m"
            memory: "200Mi"
        ports:
        - containerPort: 80
          hostPort: 30008