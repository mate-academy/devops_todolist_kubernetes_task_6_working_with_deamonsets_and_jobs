apiVersion: apps/v1
kind: DaemonSet
metadata: 
  name: mateapp-deamonset
  namespace: mateapp
  labels:
    app: todoapp
spec:
  selector:
    matchLabels: 
      app: todoapp-server
  template:
    metadata:
      labels:
        app: todoapp-server
    spec:
      containers:
        - name: busybox-server
          image: busyboxplus:curl
          command: ["sh", "-c", "curl http://localhost:8000/ && sleep 5"]
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          ports:
            - containerPort: 80
              hostPort: 30008
