apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: busybox
  namespace: mateapp
  labels:
    app: busybox
spec:
  selector:
    matchLabels:
      app: busybox
  template:
    metadata:
      labels:
        app: busybox
    spec:
      containers:
      - name: busybox
        image: ikulyk404/busyboxplus:curl
        resources:
          requests:
            memory: "100Mi"
            cpu: "100m"
          limits:
            memory: "200Mi"
            cpu: "200m"
        command:
          - sh
          - -c
          - |
            while true; do
              date
              curl http://todoapp-clusterip.mateapp.svc.cluster.local
              sleep 5
            done