apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: todo-daemonset
  namespace: mateapp
  labels:
    app: todoapp
spec:
  selector:
   matchLabels:
      app: todoapp
  template:
    metadata:
      labels:
        app: todoapp
    spec:
      containers:
        - name: todo-daemonset
          image: ikulyk404/busyboxplus:curl
          command: ["/bin/sh", "-c", "while true; do curl http://todoapp-service.mateapp.svc.cluster.local; sleep 5; done"]
          resources:
            requests:
              cpu: "100m"
              memory: "50Mi"
            limits:
              cpu: "200m"
              memory: "100Mi"
          ports:
          - containerPort: 80
            hostPort: 30008
