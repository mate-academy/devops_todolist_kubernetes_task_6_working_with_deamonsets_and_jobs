apiVersion: apps/v1
kind: DaemonSet
metadata:
 name: daemonset-busyboxplus
 namespace: mateapp
 labels:
   app: todoapp
spec:
 selector:
   matchLabels:
     app: todoapp
 template:
   metadata:
     labels:
       app: todoapp
   spec:
     containers:
     - name: busyboxplus
       image: radial/busyboxplus:curl
       resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
       command:
        - /bin/sh
        - -c
        - |
          while true; do
            curl -s http://todoapp:80;
            sleep 5;
          done
