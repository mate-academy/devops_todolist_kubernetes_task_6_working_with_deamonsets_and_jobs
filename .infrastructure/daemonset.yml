apiVersion: apps/v1
kind: DaemonSet
metadata:
 name: todoapp
 namespace: mateapp
 labels:
   app: todoapp
spec:
 selector:
   matchLabels:
     app: mate-server
 template:
   metadata:
     labels:
       app: mate-server
   spec:
     containers:
     - name: busybox
       image: ikulyk404/busyboxplus:curl
       command:
       - sh
       - -c
       args:
       - |
          while true; do
            curl http://todoapp
            sleep 5
          done
       resources:
         requests:
           cpu: "100m"
           memory: "100Mi"
         limits:
           cpu: "200m"
           memory: "200Mi"
       ports:
       - containerPort: 80
         hostPort: 30008
