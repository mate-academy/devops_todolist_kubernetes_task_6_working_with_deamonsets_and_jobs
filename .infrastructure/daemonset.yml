apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: todoapp-curl-daemonset
  namespace: mateapp
  labels:
    app: todoapp-curl
spec:
  selector:
    matchLabels:
      app: todoapp-curl
  template:
    metadata:
      labels:
        app: todoapp-curl
    spec:
      containers:
        - name: curl
          image: busyboxplus:curl
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                curl -sS http://todoapp-service/api/health
                sleep 5
              done
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
