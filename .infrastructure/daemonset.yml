apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: curl-daemonset
  namespace: mateapp
spec:
  selector:
    matchLabels:
      app: curl-daemonset
  template:
    metadata:
      labels:
        app: curl-daemonset
    spec:
      containers:
        - name: curl
          image: busyboxplus:curl
          command: ["/bin/sh", "-c"]
          args:
            - while true; do curl -s -o /dev/null -w "%{http_code}\n" http://todoapp-service.todoapp.svc.cluster.local:80; sleep 5; done
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi