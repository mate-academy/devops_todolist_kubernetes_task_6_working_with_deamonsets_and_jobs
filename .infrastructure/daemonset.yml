apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: todoapp
  namespace: mateapp
  labels:
    app: todoapp
spec:
  selector:
    matchLabels:
      app: todoapp-server
  template:
    metadata:
      labels:
        app: todoapp-server
    spec:
      containers:
        - name: todoapp-server
          image: curlimages/curl:latest # busyboxplus:curl - not working
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                curl -i http://todoapp-service/
                sleep 5
              done
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          ports:
            - containerPort: 80
              hostPort: 30008