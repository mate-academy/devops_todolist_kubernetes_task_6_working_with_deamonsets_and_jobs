apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: todo-daemonset
  namespace: mateapp
  labels:
    app: todo-daemonset
spec:
  selector:
    matchLabels:
      app: todo-daemonset
  template:
    metadata:
      labels:
        app: todo-daemonset
    spec:
      containers:
        - name: todo-curl
          image: ikulyk404/busyboxplus:curl
          command:
            - /bin/sh
            - -c
            - |
              while true; do
              date
              curl http://todoapp
              sleep 5
              done
          resources:
            requests:
              cpu: "100m"
              memory: "100Mi"
            limits:
              cpu: "200m"
              memory: "200Mi"
          ports:
            - containerPort: 80
              hostPort: 30008
