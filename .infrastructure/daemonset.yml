apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: todoapp-request
  namespace: mateapp
  labels:
    app: mate-daemon
spec:
  selector:
    matchLabels:
      app: mate-daemon
    
  template:
    metadata:
      labels:
        app: mate-daemon
    spec:
      containers:
      - name: todoapp-request
        image: ikulyk404/busyboxplus:curl
        command:
        - /bin/sh
        - -c
        - "while true; do curl http://todoapp-service.todoapp.svc.cluster.local && sleep 5; done"
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 200m
            memory: 200Mi
          