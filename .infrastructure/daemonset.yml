apiVersion: apps/v1
kind: DaemonSet
metadata:
 name: kube2py
 namespace: mateapp
 labels:
   app: kube2py
spec:
 selector:
   matchLabels:
     app: mate-server
 template:
   metadata:
     labels:
       app: mate-server
   spec:
     restartPolicy: Always
     containers:
     - name: mate-server
       image: ikulyk404/busyboxplus:curl
       resources:
         requests:
           cpu: "100m"
           memory: "100Mi"
         limits:
           cpu: "200m"
           memory: "200Mi"
       ports:
       - containerPort: 80
         hostPort: 30008
       command: [ "/bin/sh" ]
       args:
         - -c
         - |
           while true; do
             curl -v http://todoapp-service.mateapp.svc.cluster.local:80
             echo
             sleep 5
           done
