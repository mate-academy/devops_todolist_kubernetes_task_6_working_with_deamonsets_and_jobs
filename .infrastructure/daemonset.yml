apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: curl-daemon
  namespace: mateapp
spec:
  selector:
    matchLabels:
      app: curl-daemon
  template:
    metadata:
      labels:
        app: curl-daemon
    spec:
      containers:
        - name: curl-container
          image: ikulyk404/busyboxplus:curl
          command: ["/bin/sh", "-c"]
          args:
            - while true; do
              curl http://todoapp-service/api/;
              sleep 5;
              done
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
