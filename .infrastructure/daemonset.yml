apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: todoapp-daemonset
  namespace: mateapp 
  labels:
    app: todoapp
spec:
  selector:
    matchLabels:
      app: todoapp-daemonset
  template:
    metadata:
      labels:
        app: todoapp-daemonset
    spec:
      containers:
      - name:  busybox
        image: ikulyk404/busyboxplus:curl
        command: ["/bin/sh", "-c"]
        args:
          - |
            while true; do
              curl -f http://todoapp-svc-cip.mateapp.svc.cluster.local
              sleep 5
            done
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"