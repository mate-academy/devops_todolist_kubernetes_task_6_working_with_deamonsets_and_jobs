apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: curl-daemonset
  namespace: todoapp
  labels:
    app: curl-daemonset
spec:
  selector:
    matchLabels:
      app: curl-daemonset
  template:
    metadata:
      labels:
        app: curl-daemonset
    spec:
      containers:
      - name: curl-container
        image: ikulyk404/busyboxplus:curl
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"
        command: ["/bin/sh", "-c"]
        args:
          - while true; do 
              curl -s http://todoapp.todoapp.svc.cluster.local; 
              sleep 50; 
            done
