apiVersion: v1
kind: Pod
metadata:
  name: busybox
  namespace: mateapp
spec:
  containers:
  - name: busybox
    image: ikulyk404/busyboxplus:curl
    args:
    - sleep
    - "1000"
    resources:
      requests:
        memory: "256Mi"
        cpu: "150m"
      limits:
        memory: "256Mi"
        cpu: "150m"
