apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: todoapp-curl
  namespace: mateapp
  labels:
    app: todoapp
spec:
  selector:
    matchLabels:
     app: todoapp
  template:
    metadata:
      labels:
        app: todoapp
    spec:
      containers:
      - name: busyboxcurl
        image: ikulyk404/busyboxplus:curl
        command: ["sh", "-c", "curl http://todoapp-service.todoapp:80 && sleep 5"]
        resources:
          requests:
            cpu: "100m"
            memory: 100Mi
          limits:
            cpu: "200m"
            memory: 200Mi          