apiVersion: batch/v1
kind: CronJob
metadata:
  name: health-cronjob
  namespace: mateapp
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: busybox-todoapp
            image: busyboxplus:curl
            command:
            - /bin/sh
            - -c 
            - curl http://todoapp-service.todoapp:80/api/health