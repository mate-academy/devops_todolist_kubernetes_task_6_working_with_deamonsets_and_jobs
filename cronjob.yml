apiVersion: batch/v1
kind: CronJob
metadata:
  name: health-check-cronjob
  namespace: mateapp
spec:
  schedule: "*/4 * * * *"
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  concurrencyPolicy: Allow
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: health-check
            image: busyboxplus:curl
            command:
            - /bin/sh
            - -c
            - curl -f http://todoapp-service/api/health
            resources:
              requests:
                cpu: "100m"
                memory: "64Mi"
              limits:
                cpu: "200m"
                memory: "128Mi"
          restartPolicy: OnFailure