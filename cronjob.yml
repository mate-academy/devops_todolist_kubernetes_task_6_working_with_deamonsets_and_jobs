apiVersion: batch/v1
kind: CronJob
metadata:
  name: todoapp-health-cronjob
  namespace: mateapp
  labels:
    app: todoapp-health-cronjob
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: todoapp-health-cronjob
        spec:
          containers:
          - name: curl-container
            image: radial/busyboxplus:curl
            command:
            - /bin/sh
            - -c
            - curl -s http://todoapp.mateapp.svc.cluster.local/api/health
            resources:
              requests:
                cpu: "50m"
                memory: "32Mi"
              limits:
                cpu: "100m"
                memory: "64Mi"
          restartPolicy: OnFailure
