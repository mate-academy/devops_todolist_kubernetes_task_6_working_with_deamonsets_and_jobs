apiVersion: batch/v1
kind: CronJob
metadata:
  name: mate-cronjob
  namespace: mateapp
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: curl-container
              image: busyboxplus:curl
              command: ["/bin/sh", "-c", "curl todoapp-service/api/health"]
              resources:
                requests:
                  cpu: "100m"
                  memory: "100Mi"
                limits:
                  cpu: "200m"
                  memory: "200Mi"
          restartPolicy: OnFailure
