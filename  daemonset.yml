apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: todoapp-curl-daemon
  namespace: mateapp
spec:
  selector:
    matchLabels:
      name: todoapp-curl-daemon
  template:
    metadata:
      labels:
        name: todoapp-curl-daemon
    spec:
      containers:
        - name: curl-container
          image: busyboxplus/curl
          args:
            - /bin/sh
            - -c
            - |
              while true; do
                curl http://todoapp:8000;
                sleep 5;
              done
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "50m"
              memory: "64Mi"
