apiVersion: batch/v1
kind: CronJob
metadata:
  name: todoapp-health-check
  namespace: mateapp
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: busyboxplus
              image: busyboxplus:curl
              command:
                - /bin/sh
                - -c
                - |
                  echo "$(date) - Checking TodoApp health..."
                  curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" \
                    http://todoapp-service.todoapp.svc.cluster.local:80/api/health
              resources:
                requests:
                  cpu: "10m"
                  memory: "16Mi"
                limits:
                  cpu: "100m"
                  memory: "64Mi"