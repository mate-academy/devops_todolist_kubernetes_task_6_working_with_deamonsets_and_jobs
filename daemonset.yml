apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: todoapp-curl-daemon
  namespace: mateapp
spec:
  selector:
    matchLabels:
      app: todoapp-curl-daemon
  template:
    metadata:
      labels:
        app: todoapp-curl-daemon
    spec:
      containers:
      - name: curl-runner
        image: busyboxplus:curl
        command:
        - /bin/sh
        - -c
        - |
          while true; do
            date
            curl -sS http://todoapp-service.mateapp.svc.cluster.local || true
            sleep 5
          done
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
