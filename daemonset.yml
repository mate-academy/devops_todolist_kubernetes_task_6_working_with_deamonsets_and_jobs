apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: deamonsetname
  namespace: mateapp
spec:
  selector:
    matchLabels:
      app: busybox_label
  template:
    metadata:
      name: busybox
      labels:
        app: busybox_label
      spec:
        containers:
          - name: busyboxcont
            image: busyboxplus:curl
            command: ["sh", "-c"]
            args:
              - |
                while true; do
                  curl -s http://todoapp-service.mateapp.svc.cluster.local;
                  sleep 5;
                done
            resources:
              requests:
                memory: "64Mi"
                cpu: "100m"
              limits:
                memory: "64Mi"
                cpu: "100m"
            ports:
              - containerPort: 80
                hostPort: 30008
