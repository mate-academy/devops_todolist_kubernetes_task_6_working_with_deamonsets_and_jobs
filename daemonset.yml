apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mate-daemonset
  namespace: mateapp
spec:
  selector:
    matchLabels:
      app: curl-daemon
  template:
    metadata:
      labels:
        app: curl-daemon
    spec:
      containers:
        - name: curl-container
          image: busyboxplus:curl
          command:
            [
              "/bin/sh",
              "-c",
              "while true; do curl todoapp-service; sleep 5; done",
            ]
          resources:
            requests:
              cpu: "100m"
              memory: "100Mi"
            limits:
              cpu: "200m"
              memory: "200Mi"
