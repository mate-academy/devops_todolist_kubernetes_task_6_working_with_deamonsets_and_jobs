apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: todoapp-curl-daemonset
  namespace: mateapp
  labels:
    app: todoapp-curl-daemonset
spec:
  selector:
    matchLabels:
      app: todoapp-curl-daemonset
  template:
    metadata:
      labels:
        app: todoapp-curl-daemonset
    spec:
      containers:
      - name: curl-container
        image: radial/busyboxplus:curl
        command:
        - /bin/sh
        - -c
        - |
          while true; do
             curl -s http://todoapp.mateapp.svc.cluster.local;
             sleep 5;
           done
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
